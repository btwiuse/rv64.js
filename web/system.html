<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>rv64.js — Linux in the browser</title>
  <style>
    body { font-family: ui-monospace, Menlo, monospace; max-width: 64rem; margin: 1.5rem auto; background: #111; color: #ddd; }
    h1 { font-size: 1.1rem; } a { color: #8cf; }
    #term {
      background: #000; color: #cfc; padding: 0.8rem; height: 28rem;
      overflow-y: auto; white-space: pre-wrap; word-break: break-all;
      border: 1px solid #333; border-radius: 6px; outline: none;
    }
    #term:focus { border-color: #6a6; }
    #status { color: #888; margin-top: 0.5rem; font-size: 0.85rem; }
  </style>
</head>
<body>
  <h1>rv64.js — riscv64 Linux in the browser</h1>
  <p>TinyEMU's Linux 4.15 + buildroot image on the rv64.js Rust/wasm core.
     Click the terminal and type. Images: run <code>web/get-images.sh</code> first.</p>
  <div id="term" tabindex="0">booting…\n</div>
  <div id="status"></div>
  <script type="module">
    import { RV64 } from "./rv64.js";

    const term = document.getElementById("term");
    const status = document.getElementById("status");
    term.textContent = "";

    // Minimal terminal: append text, strip CSI color sequences.
    const dec = new TextDecoder();
    function write(bytes) {
      let s = dec.decode(bytes, { stream: true });
      s = s.replace(/\x1b\[[0-9;?]*[A-Za-z]/g, "").replace(/\r/g, "");
      term.textContent += s;
      term.scrollTop = term.scrollHeight;
    }

    async function fetchBin(url) {
      const r = await fetch(url);
      if (!r.ok) throw new Error(`fetch ${url}: ${r.status}`);
      return new Uint8Array(await r.arrayBuffer());
    }

    const vm = await RV64.create(fetch("../target/wasm32-unknown-unknown/release/rv64_wasm.wasm"));
    vm.onWrite = (_fd, bytes) => write(bytes);

    let bios, kernel, disk;
    try {
      [bios, kernel, disk] = await Promise.all([
        fetchBin("images/bbl64.bin"),
        fetchBin("images/kernel-riscv64.bin"),
        fetchBin("images/root-riscv64.bin"),
      ]);
    } catch (e) {
      term.textContent = `missing guest images — run web/get-images.sh\n(${e.message})`;
      throw e;
    }

    vm.bootLinux({ bios, kernel, disk });

    // Keyboard -> guest console.
    const enc = new TextEncoder();
    term.addEventListener("keydown", (ev) => {
      if (ev.ctrlKey && ev.key.length === 1) {
        const c = ev.key.toUpperCase().charCodeAt(0) - 64;
        if (c >= 0 && c < 32) vm.consoleInput(new Uint8Array([c]));
        ev.preventDefault();
        return;
      }
      const map = { Enter: "\r", Backspace: "\x7f", Tab: "\t", Escape: "\x1b",
                    ArrowUp: "\x1b[A", ArrowDown: "\x1b[B", ArrowRight: "\x1b[C", ArrowLeft: "\x1b[D" };
      const s = map[ev.key] ?? (ev.key.length === 1 ? ev.key : null);
      if (s) {
        vm.consoleInput(enc.encode(s));
        ev.preventDefault();
      }
    });

    // Main loop: run ~10ms of guest per frame.
    const t0 = performance.now();
    let last = t0;
    function frame() {
      const off = vm.runSystem(3_000_000n);
      const now = performance.now();
      if (now - last > 500) {
        last = now;
        const insns = Number(vm.sysInsnCount());
        status.textContent =
          `${(insns / 1e6).toFixed(0)} Minsns · ` +
          `${(insns / (now - t0) / 1e3).toFixed(1)} Minsn/s · ` +
          `${((now - t0) / 1000).toFixed(0)}s`;
      }
      if (off) {
        write(enc.encode("\n[guest powered off]\n"));
        return;
      }
      setTimeout(frame, 0);
    }
    term.focus();
    frame();
  </script>
</body>
</html>
