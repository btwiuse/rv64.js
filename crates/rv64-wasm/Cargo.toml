[package]
name = "rv64-wasm"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "wasm32 export surface for rv64.js — plain extern \"C\" ABI, v86-style (no wasm-bindgen)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
getrandom = { version = "=0.2.17", features = ["custom"] }
rv64-core = { path = "../rv64-core" }
rv64-linux = { path = "../rv64-linux" }
rv64-system = { path = "../rv64-system" }
rv64-jit = { path = "../rv64-jit" }
