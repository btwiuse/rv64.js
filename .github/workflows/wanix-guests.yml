name: WANIX guest release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to create or update in this repository
        required: true
        type: string
      publish:
        description: Upload archives to the selected release
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: wanix-guest-release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.arch }}-${{ matrix.profile }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        arch: [riscv64, x86, arm64]
        profile: [minimal, container, container-full]

    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Build and validate guest archive
        run: |
          chmod +x tools/build-wanix-release-assets.sh
          tools/build-wanix-release-assets.sh \
            "${{ matrix.arch }}" \
            "${{ matrix.profile }}" \
            "target/wanix-guests/${{ matrix.arch }}-${{ matrix.profile }}"

      - uses: actions/upload-artifact@v4
        with:
          name: wanix-${{ matrix.arch }}-${{ matrix.profile }}
          path: target/wanix-guests/${{ matrix.arch }}-${{ matrix.profile }}/wanix-linux-*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: target/wanix-guests
          pattern: wanix-*
          merge-multiple: true

      - name: Verify release payload
        run: |
          shopt -s nullglob
          assets=(target/wanix-guests/wanix-linux-*.tgz)
          test "${#assets[@]}" -eq 9
          sha256sum "${assets[@]}" | tee target/wanix-guests/SHA256SUMS

      - name: Publish to this repository's release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "WANIX guest images $RELEASE_TAG" \
              --notes "Built and verified by GitHub Actions from $GITHUB_SHA."
          fi
          gh release upload "$RELEASE_TAG" \
            target/wanix-guests/wanix-linux-*.tgz \
            target/wanix-guests/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --clobber
