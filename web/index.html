<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>rv64.js — phase 0 demo</title>
  <style>
    body { font-family: ui-monospace, monospace; max-width: 60rem; margin: 2rem auto; }
    pre { background: #f4f4f4; padding: 1rem; overflow-x: auto; }
    @media (prefers-color-scheme: dark) {
      body { background: #111; color: #ddd; }
      pre { background: #1c1c1c; }
    }
  </style>
</head>
<body>
  <h1>rv64.js — phase 0</h1>
  <p>Runs a hand-assembled RV64I program (sum 1..10) on the Rust/wasm core.</p>
  <pre id="out">loading…</pre>
  <script type="module">
    import { RV64, Stop } from "./rv64.js";

    const out = document.getElementById("out");
    const log = (s) => (out.textContent += s + "\n");
    out.textContent = "";

    const BASE = 0x1000;
    // sum 1..10 into x1, then ecall (same program as the Rust unit test)
    const program = new Uint32Array([
      0x00000093, // addi x1, x0, 0
      0x00100113, // addi x2, x0, 1
      0x00b00193, // addi x3, x0, 11
      0x002080b3, // add  x1, x1, x2
      0x00110113, // addi x2, x2, 1
      0xfe311ce3, // bne  x2, x3, -8
      0x00000073, // ecall
    ]);

    const vm = await RV64.create(fetch("../target/wasm32-unknown-unknown/release/rv64_wasm.wasm"));
    vm.init(BASE, 64 * 1024);
    vm.load(BASE, new Uint8Array(program.buffer));

    const stop = vm.run();
    log(`stop reason : ${Object.keys(Stop)[stop]} (${stop})`);
    log(`insns       : ${vm.insnCount()}`);
    log(`x1 (sum)    : ${vm.reg(1)}  (expected 55)`);
    log(`pc          : 0x${vm.pc.toString(16)}`);
    log(stop === Stop.ECALL && vm.reg(1) === 55n ? "\nPASS ✅" : "\nFAIL ❌");
  </script>
</body>
</html>
