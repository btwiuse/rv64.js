name: Pages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
      - "crates/**"
      - "vendor/**"
      - "web/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "rust-toolchain.toml"
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'release' || github.event.release.tag_name == 'demo-images-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Build WebAssembly core
        run: cargo build -p rv64-wasm --target wasm32-unknown-unknown --release
      - name: Assemble static site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir _site
          cp -R web/. _site/
          cp target/wasm32-unknown-unknown/release/rv64_wasm.wasm _site/
          mkdir -p _site/assets/demo-images-v2
          gh release download demo-images-v2 \
            --repo ibuildthecloud/rv64.js \
            --pattern 'fast-*' \
            --pattern 'modern-*' \
            --dir _site/assets/demo-images-v2
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
