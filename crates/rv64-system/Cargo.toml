[package]
name = "rv64-system"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Full-system riscv64 machine for rv64.js: RAM, CLINT, PLIC, virtio-mmio, DTB (TinyEMU-compatible layout)"

[dependencies]
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["alloc", "pkcs8"] }
getrandom = "=0.2.17"
oxitls-rustcrypto-provider = { version = "=0.2.1", default-features = false, features = ["std", "tls12"] }
rcgen = { version = "=0.14.8", default-features = false }
rv64-core = { path = "../rv64-core" }
rustls = { version = "=0.23.42", default-features = false, features = ["std", "tls12"] }
rustls-pki-types = { version = "=1.15.1", features = ["web"] }
sha2 = { version = "=0.10.9", default-features = false }
