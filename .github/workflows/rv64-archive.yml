name: rv64 emulator archive

on:
  workflow_dispatch:
    inputs:
      upstream_release:
        description: Upstream release tag that publishes rv64.js and rv64_wasm.wasm
        required: true
        default: v0.3.0
      publish_tag:
        description: Release tag to create or update in this repository
        required: true
        default: rv64-archive-manual

permissions:
  contents: write

jobs:
  build:
    name: Build and publish rv64.tgz
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Build rv64-vm.wasm
        working-directory: integrations/wanix/adapter
        run: |
          GOWORK=off GOOS=js GOARCH=wasm go build \
            -o ../../dist/rv64-vm.wasm .

      - name: Build rv64_wasm.wasm
        run: |
          cargo build -p rv64-wasm \
            --target wasm32-unknown-unknown \
            --release
          cp target/wasm32-unknown-unknown/release/rv64_wasm.wasm \
            integrations/wanix/dist/rv64_wasm.wasm

      - name: Download upstream rv64.js loader
        env:
          UPSTREAM: ${{ inputs.upstream_release }}
        run: |
          mkdir -p integrations/wanix/dist/rv64-release
          curl --fail --location --retry 3 \
            -o integrations/wanix/dist/rv64-release/rv64.js \
            "https://github.com/btwiuse/rv64.js/releases/download/${UPSTREAM}/rv64.js"

      - name: Bundle rv64.tgz
        working-directory: integrations/wanix
        run: |
          tar -cf - -C dist rv64-vm.wasm rv64_wasm.wasm > dist/rv64.tgz
          tar -rf dist/rv64.tgz -C dist/rv64-release rv64.js
          gzip -n -f dist/rv64.tgz

      - name: Inspect archive contents
        working-directory: integrations/wanix
        run: |
          tar -tzf dist/rv64.tgz | sort
          tar -tzf dist/rv64.tgz | grep -qx 'rv64-vm.wasm'
          tar -tzf dist/rv64.tgz | grep -qx 'rv64_wasm.wasm'
          tar -tzf dist/rv64.tgz | grep -qx 'rv64.js'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rv64-archive
          path: integrations/wanix/dist/rv64.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rv64-archive
          path: integrations/wanix/dist

      - name: Publish to this repository's release
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_TAG: ${{ inputs.publish_tag }}
        run: |
          if ! gh release view "$PUBLISH_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$PUBLISH_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Wanix rv64 emulator $PUBLISH_TAG" \
              --notes "Bundles rv64-vm.wasm, rv64_wasm.wasm, and rv64.js for the Wanix rv64 backend."
          fi
          gh release upload "$PUBLISH_TAG" \
            integrations/wanix/dist/rv64.tgz \
            --repo "$GITHUB_REPOSITORY" --clobber
