[env]
# Cpu contains fixed interpreter/JIT TLB arrays. Unoptimized construction can
# exceed libtest's 2 MiB worker stack; release builds do not. Rust's test
# harness reads this variable when it creates worker threads.
RUST_MIN_STACK = { value = "4194304", force = false }

[target.wasm32-unknown-unknown]
# Export + allow growing the function table so the JS host can register
# JIT-compiled block functions for call_indirect dispatch (v86-style).
rustflags = ["-C", "link-arg=--export-table", "-C", "link-arg=--growable-table"]
